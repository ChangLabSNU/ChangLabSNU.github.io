# Builds the site on every push to main and every pull request; only main is
# deployed to GitHub Pages, which is the live qbio.io. (./sync.sh refreshes a
# backup mirror on the lab server from the same commit.)
name: Build and deploy to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments queue up and are never cancelled midway; a pull request's
# superseded runs are.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # ruby-version is read from .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Check links and images
        # Internal only: external sites fail too often for reasons of their own.
        # /share/ is a separate Pages site published under the same domain.
        run: >-
          bundle exec htmlproofer ./_site
          --disable-external
          --no-enforce-https
          --swap-urls '^https\://qbio\.io:'
          --ignore-urls '/^(https:\/\/qbio\.io)?\/share\//'
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        # Uploads the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
