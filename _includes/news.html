{%- comment -%}
  The home page's news column: the latest entries of _data/news.yml.
{%- endcomment -%}
<section class="news" aria-labelledby="news-heading">
  <h2 id="news-heading">News</h2>
  <ul class="news-list">
    {%- for article in site.data.news limit:5 %}
    <li><span class="news-date">{{ article.date }}</span> {{ article.headline }}</li>
    {%- endfor %}
  </ul>
  <a class="news-more" href="{{ site.baseurl }}/allnews.html">All news</a>
</section>
