# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: The Chang Lab
email: hyeshik@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Hyeshik Chang's Quantitative Molecular Biology Laboratory in the School of Biological
  Sciences at Seoul National University, South Korea.
baseurl: ""
# Absolute base for canonical links and Open Graph tags. `jekyll serve`
# overrides this with the local address, so it does not leak into dev.
url: "https://qbio.io"

destination: ./_site

# jekyll-sitemap is already resolved in Gemfile.lock (it comes in with
# minimal-mistakes-jekyll), it just was never loaded: there was no plugins
# key at all, which is why every page carried a decorative `sitemap: false`.
plugins:
  - jekyll-sitemap

include:
  - .htaccess
  - _pages

# Repo-only files. Without this list Jekyll copies every unrecognised file at
# the site root into _site/, which published CLAUDE.md, README.md, run.sh and
# sync.sh to qbio.io. Jekyll appends its own defaults (Gemfile, vendor/, ...)
# to whatever is listed here, so those do not need repeating.
exclude:
  - CLAUDE.md
  - README.md
  - run.sh
  - sync.sh
  # Carousel photos kept for reuse but not on the front page today.
  - images/_home-slider-archive/

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - slash-div
    - if-function

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

