# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: The Chang Lab
email: hyeshik@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Hyeshik Chang's Quantitative Molecular Biology Laboratory in the School of Biological
  Sciences at Seoul National University, South Korea.
baseurl: ""
# Absolute base for canonical links and Open Graph tags. `jekyll serve`
# overrides this with the local address, so it does not leak into dev.
url: "https://qbio.io"

destination: ./_site

# Also listed in the Gemfile's :jekyll_plugins group, which is what pins it.
plugins:
  - jekyll-sitemap

include:
  - _pages

# Repo-only files. Without this list Jekyll copies every unrecognised file at
# the site root into _site/, which published CLAUDE.md, README.md, run.sh and
# sync.sh to qbio.io. Jekyll appends its own defaults (Gemfile, vendor/, ...)
# to whatever is listed here, so those do not need repeating.
exclude:
  - CLAUDE.md
  - README.md
  - run.sh
  - sync.sh
  - environment.yml
  # Carousel photos kept for reuse but not on the front page today.
  - images/_home-slider-archive/

# Presets for {% picture %} (_plugins/picture.rb). `widths` are the WebP
# copies to make, in pixels; `sizes` tells the browser how wide the image is
# drawn, so it can pick one before layout. Both were measured from the
# rendered pages (the layout stops growing at a 1000px viewport): widths cover
# the largest drawn size at 1x and 2x. Re-measure if a layout changes width.
pictures:
  slide:          # home carousel, 283-675px wide
    widths: [600, 1200]
    sizes: "(min-width: 1000px) 575px, (min-width: 768px) calc(66.67vw - 92px), calc(100vw - 92px)"
  member-thumb:   # team page photos, 85-183px wide
    widths: [180, 360]
    sizes: "(min-width: 1000px) 117px, (min-width: 768px) calc(12.5vw - 8px), calc(25vw - 8px)"
  figure-wide:    # full-width figure in a text page, up to 968px
    widths: [1000, 2000]
    sizes: "(min-width: 1000px) 968px, calc(100vw - 32px)"
  figure-side:    # .qb-fig-right-400/420 floats
    widths: [420, 840]
    sizes: "420px"

sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - slash-div
    - if-function

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

